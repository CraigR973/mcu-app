<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="The Real MCU">
  <!-- A disc on a shelf: the two things this app is about. Drawn rather than
       photographed so it stays legible at 32px in a browser tab. -->
  <rect width="512" height="512" rx="112" fill="#0B1220"/>
  <!-- Shelf -->
  <rect x="72" y="392" width="368" height="18" rx="9" fill="#1E293B"/>
  <rect x="72" y="392" width="368" height="6" rx="3" fill="#334155"/>
  <!-- Disc -->
  <circle cx="256" cy="238" r="150" fill="#4F46E5"/>
  <circle cx="256" cy="238" r="150" fill="none" stroke="#818CF8" stroke-width="6"/>
  <!-- Sheen, so the disc reads as a disc and not a dot -->
  <path d="M256 88a150 150 0 0 0-106 256L256 238z" fill="#6366F1" opacity="0.55"/>
  <circle cx="256" cy="238" r="46" fill="#0B1220"/>
  <circle cx="256" cy="238" r="16" fill="#1E293B"/>
</svg>
