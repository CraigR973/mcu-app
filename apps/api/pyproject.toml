[project]
name = "mcu-api"
version = "0.0.1"
description = "Mark's Cinematic Universe — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.14.0",
    "alembic>=1.13.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    # Retained until Batch 4 ports the existing import and trigger-test assets
    # from their legacy psycopg2 connections to the new baseline.
    "psycopg2-binary>=2.9.9",
    "openpyxl>=3.1.0",
    # Batch 3 — auth. bcrypt for PIN hashing, PyJWT for HS256 access/refresh
    # tokens, slowapi for the in-process limits that sit in front of the durable
    # Postgres counters.
    "bcrypt>=4.1.3",
    # 2.14.0 at least: 2.13.0 carries ten advisories published after 28 Sep 2026 (JWK,
    # JWKS and malformed-token handling), which the CI dependency audit refuses.
    "pyjwt>=2.14.0",
    "slowapi>=0.1.9",
    # Batch 19 — the scraper framework's CSS selectors. beautifulsoup4 with Python's own
    # `html.parser`, deliberately **not** lxml: lxml needs libxml2 and libxslt in the
    # image, and `AGENTS.md` notes the Docker image is built by Railway and not by CI — so
    # a missing shared object would fail a deploy rather than a pull request. Batch 14
    # turned down a PDF renderer for the same reason.
    "beautifulsoup4>=4.12.3",
    # Batch 11 — Web Push. VAPID signs an ES256 JWT and RFC 8291 encrypts the payload
    # with ECDH P-256 + HKDF + AES-128-GCM; PyJWT is already here but cannot do ES256
    # without this, and there is no pure-Python route to the encryption at all.
    #
    # **One dependency, not four.** `pywebpush` would bring `http-ece` and `py-vapid`
    # alongside it; the encryption is ~60 lines against a published RFC, and writing it
    # here means the test can derive the keys from the *receiver* side — which is the
    # browser's half of the algorithm — rather than trusting a library to agree with
    # itself. `cryptography` ships manylinux wheels with its own OpenSSL, so unlike the
    # lxml case above it adds nothing to the Railway image's system libraries.
    #
    # **Floor at 50, and the floor is a security floor.** 48.0.1 carries five advisories
    # (PYSEC-2026-3552/3553/3554) and the dependency audit refuses it — correctly. An
    # earlier revision of this line pinned `<49` because cryptography 49+ ships no
    # `macosx-10.15-x86_64` wheel, so the developer machine builds from Rust source while
    # CI installs a manylinux wheel. That convenience is not worth a vulnerable crypto
    # library in production: the pin is gone, and the local/CI note now lives in
    # `STATUS.md`'s gotchas instead of in a version bound.
    "cryptography>=50.0.0",
    # Batch 30 — the AI assistant's client. The official SDK rather than raw HTTP against
    # `/v1/messages`: the request shapes for thinking, effort and tool use have all moved
    # in the last year, and a hand-rolled client is a second place for that drift to land.
    "anthropic>=0.69.0",
    # Batch 25 — server-side photo resize. Without it the spec's raw sizing is 5 MB × 5 ×
    # 1,857 ≈ 46 GB in a database that is 35 MB today; with it the worst case is ~2.8 GB
    # and the realistic case under 200 MB. Pillow ships wheels for every platform this
    # project builds on, so unlike the lxml case it adds nothing to the Railway image.
    "pillow>=11.0.0",
    # FastAPI needs this to parse a multipart body at all. Base64 in JSON would avoid
    # it and cost a third more bytes on a phone's upload, which is the connection least
    # able to spare them.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "types-openpyxl>=3.1.0",
    "types-psycopg2>=2.9.21",
    # Batch 35 — the movie-night listener talks to asyncpg directly, and asyncpg ships no
    # `py.typed`. Real stubs rather than a mypy override for the module: the override
    # would also stop checking every *use* of asyncpg, and a `LISTEN` connection is
    # exactly the code worth having typed.
    "asyncpg-stubs>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI Depends() in function defaults is the intended pattern
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
