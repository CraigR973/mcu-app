name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ── Python API ──────────────────────────────────────────────────────────────
  api:
    name: API — lint · typecheck · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Lint (ruff format)
        run: ruff format --check .

      - name: Typecheck (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest

  # ── React / TypeScript Web ──────────────────────────────────────────────────
  web:
    name: Web — lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm --filter @mcu/web lint

      - name: Typecheck (shared)
        run: pnpm --filter @mcu/shared typecheck

      - name: Typecheck (web)
        run: pnpm --filter @mcu/web typecheck

      - name: Test (vitest)
        run: pnpm --filter @mcu/web test

      - name: Build (shared)
        run: pnpm --filter @mcu/shared build

      - name: Build (web)
        run: pnpm --filter @mcu/web build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder_key
