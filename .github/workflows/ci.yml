name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]

jobs:
  api-quality:
    name: API — lint · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint (ruff check)
        run: ruff check .

      - name: Lint (ruff format)
        run: ruff format --check .

      - name: Typecheck (mypy)
        run: mypy src

  api-test:
    name: API — pytest + Postgres 17
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mcu_test
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Apply migrations
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest

  migration-check:
    name: Database — upgrade head · downgrade base
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcu_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mcu_migration
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Downgrade to base
        run: alembic downgrade base

  # The image Railway deploys, built and booted the way production runs it. Until this job,
  # CI never built the Dockerfile, so a broken image surfaced only at deploy time.
  image:
    name: Image — build · migrate · boot
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcu_image
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag mcu-api:ci .

      - name: Import every cron job's module, as named in .railway/railway.ts
        run: |
          modules=$(grep -o 'python -m src\.scripts\.[a-z_]*' .railway/railway.ts | sed 's/^python -m //' | sort -u)
          test -n "$modules"
          for module in $modules; do
            echo "import $module"
            docker run --rm mcu-api:ci python -c "import $module"
          done

      - name: Boot it as production does, migrating first, until it is ready
        run: |
          docker run --detach --name api --network host \
            --env ENVIRONMENT=production \
            --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/mcu_image \
            --env JWT_ACCESS_SECRET=ci-access-secret-with-at-least-32-characters \
            --env JWT_REFRESH_SECRET=ci-refresh-secret-with-at-least-32-characters \
            --env FRONTEND_ORIGIN=https://ci.example.invalid \
            --env PORT=8000 \
            mcu-api:ci
          for second in $(seq 1 90); do
            if curl --silent http://localhost:8000/api/v1/health/ready | grep -q '"db":"ok"'; then
              echo "ready after ${second}s"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' api)" != "true" ]; then
              echo "the container stopped before it was ready"
              break
            fi
            sleep 1
          done
          docker logs api
          exit 1

  web:
    name: Web — lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm --filter @mcu/web lint

      - name: Typecheck (shared)
        run: pnpm --filter @mcu/shared typecheck

      - name: Typecheck (web)
        run: pnpm --filter @mcu/web typecheck

      - name: Test (web + shared)
        run: pnpm -r test

      - name: Build (shared)
        run: pnpm --filter @mcu/shared build

      - name: Build (web)
        run: pnpm --filter @mcu/web build
        env:
          VITE_API_URL: https://api.example.invalid
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder_key

  # Batch 38 (Phase 13.10, DECISIONS.md #285). The bundle the web job builds, booted in three
  # browsers against the real API on a real Postgres with every outside service faked, plus the
  # cron jobs run as Railway runs them. Until this job CI built the web app and never ran it.
  #
  # **Not on every push to a feature branch.** A pull request's commits already run CI twice (the
  # push and the pull_request events), and this job is the longest in the file. It runs on pull
  # requests, on pushes to main and by hand, so a PR commit pays for it once.
  e2e:
    name: E2E — Chromium · Firefox · WebKit · jobs
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Installing WebKit's Ubuntu dependencies can exceed 40 minutes when the apt mirror
    # is slow; keep the browser gate intact and allow the packages to finish.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # A throwaway server. The harness makes its own databases on it and refuses anything that
      # does not look local.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install the API's dependencies
        run: pip install --require-hashes -r apps/api/requirements-dev.lock

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (e2e)
        run: pnpm --filter @mcu/e2e typecheck

      - name: Build (shared)
        run: pnpm --filter @mcu/shared build

      - name: Cache the browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-1.60.0

      - name: Install the browsers
        run: pnpm --filter @mcu/e2e exec playwright install --with-deps chromium firefox webkit

      - name: Run the suite (builds the bundle once, then each browser, then the jobs)
        run: pnpm --filter @mcu/e2e e2e

      - name: Keep the reports and logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
            apps/e2e/.run/world/log.jsonl
            apps/e2e/.run/api.log
            apps/e2e/.run/web.log
          retention-days: 7

  dependency-audit:
    name: Dependencies — Python · pnpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python audit tool
        run: pip install pip-audit==2.10.1

      - name: Audit locked Python runtime dependencies
        run: pip-audit -r requirements.lock --require-hashes --disable-pip
        working-directory: apps/api

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level=high
